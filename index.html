<!DOCTYPE html>
<html>
<head>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load('current', {'packages':['corechart']});
        google.charts.setOnLoadCallback(drawChart);

        function drawChart() {
            var data = google.visualization.arrayToDataTable([
                ['Carencia Social', '2008 (%)', '2018 (%)'],
                ['Rezago educativo', 21.9, 16.9],
                ['Acceso a los servicios de salud', 38.4, 16.2],
                ['Acceso a la seguridad social', 65.0, 57.3],
                ['Calidad y espacios de la vivienda', 17.7, 11.1],
                ['Acceso a los servicios básicos en la vivienda', 22.9, 19.8],
                ['Acceso a la alimentación', 21.7, 20.4]
            ]);

            var options = {
                title: 'Evolución de las Carencias Sociales',
                chartArea: {width: '60%'},
                hAxis: {
                    title: 'Porcentaje',
                    minValue: 0
                },
                vAxis: {
                    title: 'Carencia Social'
                },
                legend: { position: 'top' },
                bars: 'horizontal'
            };

            var chart = new google.visualization.BarChart(document.getElementById('bar_chart'));
            chart.draw(data, options);
        }
    </script>
</head>
<body>
    <div id="bar_chart" style="width: 900px; height: 500px"></div>
</body>
</html>
